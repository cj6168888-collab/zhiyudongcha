services:
  database:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sheng-yu-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "--maxmemory", "512mb"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sheng-yu-network

  migrate:
    image: sheng-yu-server-migrate:${DOCKER_TAG:-latest}
    build:
      context: .
      dockerfile: ./server/Dockerfile
      target: builder
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.production
    command: ["npm", "run", "db:migrate"]
    networks:
      - sheng-yu-network

  app:
    image: sheng-yu-server:${DOCKER_TAG:-latest}
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./server/Dockerfile
      target: runner
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env.production
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - app_logs:/app/logs
      - ./server/public:/app/public
    networks:
      - sheng-yu-network

networks:
  sheng-yu-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  app_logs:
