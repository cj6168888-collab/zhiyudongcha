name: E2E Tests

on:
  push:
    branches: [main, develop, codex/github-sync-snapshot]
  pull_request:
    branches: [main, codex/github-sync-snapshot]

permissions:
  contents: read

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run mobile conversation Playwright tests
        run: npx playwright test tests/e2e/mobile-conversation-home.spec.ts --project="Mobile Chrome"
        env:
          CI: true

      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            test-results/
            !test-results/**/*.zip
          retention-days: 30
